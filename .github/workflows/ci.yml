# specs/swift.md 'CI'. check · swift 는 push · PR, export 는 main push 에서 두 job 통과 후
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run check:skill
      # 전체 history 검사는 release.targets 도입 전 커밋 (packages/ 없음) 에서 gnam 이 실패 → push · PR 범위만
      - if: github.event_name == 'push'
        run: npx gnam verify --push ${{ github.event.before }} ${{ github.sha }}
      - if: github.event_name == 'pull_request'
        run: npx gnam verify --range origin/${{ github.base_ref }}..HEAD

  swift:
    runs-on: macos-15-intel  # arm64 runner 용량 부족으로 할당 실패 반복 (2026-11-05)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            swift/.build
            examples/swift/ShopExample/.build
          key: swift-${{ runner.os }}-${{ hashFiles('swift/Package.swift') }}
      - run: swift --version
      - run: swift test --package-path swift
      - run: swift build --package-path examples/swift/ShopExample

  export:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, swift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # 배포 저장소의 원본 커밋을 찾는다
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: 배포 저장소 자격 (gentizer-swift 쓰기 deploy key)
        env:
          DEPLOY_KEY: ${{ secrets.GENTIZER_SWIFT_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/gentizer_swift
          chmod 600 ~/.ssh/gentizer_swift
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/gentizer_swift -o IdentitiesOnly=yes"
          git config --global url."git@github.com:obov/gentizer-swift.git".insteadOf "https://github.com/obov/gentizer-swift.git"
          git config --global user.name "gentizer-export"
          git config --global user.email "gentizer-export@users.noreply.github.com"
      - run: npx gnam run export build swift
      - run: npx gnam run export push swift
